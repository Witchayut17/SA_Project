name: React App CI/CD 
 
on: 
  push: 
    branches: 
      - main 
 
jobs: 
  build-and-push-docker-image: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v6 
 
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v4 
 
      - name: Login to Docker Hub 
        uses: docker/login-action@v4 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 
 
      - name: Build and push Docker image 
        uses: docker/build-push-action@v7 
        with: 
          context: . 
          push: true
          tags: witchayut17/devopsfinal:latest  
 
  deploy: 
    needs: build-and-push-docker-image 
    runs-on: ubuntu-latest 
    steps: 
      - name: Deploy to Server via SSH 
        uses: appleboy/ssh-action@v0.1.10 
        with: 
          host: ${{ secrets.SERVER_HOST }} 
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SERVER_SSH_KEY }} 
          # สคริปต์ที ่จะไปรันบนเซิร์ฟเวอร์ของคุณเพื ่อดึง Image ใหม่มาเปิด 
          script: | 
            docker pull witchayut17/devopsfinal:latest 
            docker stop my-react-app || true 
            docker rm my-react-app || true 
            docker run -d --name my-react-app -p 80:80 witchayut17/devopsfinal:latest
